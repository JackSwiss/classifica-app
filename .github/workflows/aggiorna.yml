name: Aggiorna dati

on:
  schedule:
    - cron: "17 6 * * *"   # ogni giorno alle 6:17 UTC (8:17 in Italia d'estate, 7:17 d'inverno)
  workflow_dispatch:        # aggiunge un bottone per lanciarlo a mano

permissions:
  contents: write

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scarica le classifiche da Apple
        run: python aggiorna.py

      - name: Salva i nuovi dati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "Aggiorna dati $(date -u +%F)"
          git push
